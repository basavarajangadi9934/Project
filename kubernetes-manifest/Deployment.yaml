apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot
  labels:
    app: springboot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: springboot-app
  template:
    metadata:
      labels:
        app: springboot-app
    spec:
      containers:
        - name: springboot-container
          image: docker.io/basavaraj1234/argocd-springboot:latest
          ports:
           - containerPort: 8080
